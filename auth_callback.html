<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>Agent Pro — 로그인 처리 중</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.css" />
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: 'Pretendard Variable', sans-serif;
  background: #FAFAF7; color: #1A1A1F;
  display: grid; place-items: center; min-height: 100vh; padding: 20px;
}
.box {
  text-align: center; padding: 40px;
  background: #fff; border-radius: 18px;
  box-shadow: 0 24px 64px rgba(26,26,31,0.08);
  max-width: 420px;
}
.brand { font-family: 'JetBrains Mono', monospace; font-size: 11px; letter-spacing: 0.22em; color: #1F4D3F; margin-bottom: 16px; }
.title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 8px; }
.sub { color: #5C5C66; font-size: 13px; line-height: 1.6; margin-bottom: 24px; }
.spinner { display: inline-block; width: 28px; height: 28px; border: 3px solid #E8E5DE; border-top-color: #1F4D3F; border-radius: 50%; animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.err { color: #B23A2A; }
.link { display: inline-block; margin-top: 16px; padding: 10px 18px; background: #1F4D3F; color: #fff; border-radius: 10px; text-decoration: none; font-size: 13px; font-weight: 600; }
</style>
</head>
<body>
<div class="box">
  <div class="brand">AGENT PRO 1.0</div>
  <div class="spinner"></div>
  <h1 class="title" id="title" style="margin-top:18px">로그인 처리 중...</h1>
  <p class="sub" id="sub">잠시만 기다려주세요.</p>
  <a class="link" id="retryLink" href="/login.html" style="display:none">다시 로그인</a>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://pddasonkizwviwqzdhpu.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_g_WkmPy-txtru1D93pl8iA_kddaB4GQ';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const params = new URLSearchParams(location.search);
const redirectTo = params.get('redirect') || '/';

function fail(msg) {
  document.getElementById('title').textContent = '로그인 실패';
  document.getElementById('title').classList.add('err');
  document.getElementById('sub').textContent = msg;
  document.querySelector('.spinner').style.display = 'none';
  document.getElementById('retryLink').style.display = 'inline-block';
}

(async () => {
  try {
    // URL hash (= #access_token=... = implicit flow)
    if (location.hash && location.hash.includes('access_token')) {
      // Supabase SDK가 자동 처리 — 잠시 후 getSession 확인
      await new Promise(r => setTimeout(r, 300));
    }
    // URL query (= ?code=... = PKCE flow)
    const code = params.get('code');
    if (code) {
      const { error } = await sb.auth.exchangeCodeForSession(code);
      if (error) throw error;
    }
    const errorParam = params.get('error_description') || params.get('error');
    if (errorParam) throw new Error(errorParam);

    // 세션 확인
    const { data } = await sb.auth.getSession();
    if (!data.session) {
      throw new Error('세션 생성 실패. 다시 로그인해주세요.');
    }

    // ★ URL ?c=slug → user_metadata.preferred_company 저장 (= Google OAuth·매직 링크 = 가입 시점에 박힘)
    const companySlug = params.get('c');
    if (companySlug) {
      const currentMeta = data.session.user.user_metadata || {};
      // 옛 값 없거나 다른 값이면 = 갱신 (= 최신 클릭 URL 우선)
      if (currentMeta.preferred_company !== companySlug) {
        await sb.auth.updateUser({ data: { ...currentMeta, preferred_company: companySlug } });
      }
    }

    // ★ Tauri 데스크탑 앱 사용자 = 본 콜백 = 본인 Chrome (= 외부 브라우저)에서 박힘
    // = 본 페이지 = session 자료 deep link로 = 본 앱에 박음 → 본 창 닫음 안내
    const isDesktop = params.get('app') === 'desktop';
    if (isDesktop) {
      const session = data.session;
      const desktopUrl = `agent-pro://auth#access_token=${encodeURIComponent(session.access_token)}&refresh_token=${encodeURIComponent(session.refresh_token)}&expires_in=${session.expires_in}&token_type=Bearer`;
      // 본 앱에 deep link 박음 = Tauri = on_open_url handler 받음
      location.href = desktopUrl;
      // 본 창 = 안내 자료 박음 (= 자동 redirect 후도 표시)
      setTimeout(() => {
        document.getElementById('title').textContent = '인증 완료';
        document.getElementById('sub').innerHTML = '★ Agent Pro 앱으로 자동 진입.<br>본 브라우저 창 = 닫으셔도 됩니다.';
        document.querySelector('.spinner').style.display = 'none';
      }, 500);
      return;
    }

    // 웹 사용자 = 옛 path 그대로
    const safe = redirectTo.startsWith('/') && !redirectTo.startsWith('//') ? redirectTo : '/';
    location.href = safe;
  } catch (err) {
    fail(err.message || String(err));
  }
})();
</script>
</body>
</html>
